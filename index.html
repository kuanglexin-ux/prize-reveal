<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中奖结果公示与兑奖平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              300: '#FDE047',
              400: '#FACC15',
              500: '#EAB308',
              600: '#CA8A04',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      min-height: 100vh;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .gold-border-glow {
      border: 1px solid rgba(234, 179, 8, 0.35);
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.12);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .gold-border-glow:hover {
      border-color: rgba(250, 204, 21, 0.85);
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.3);
      transform: translateY(-4px);
    }
    .shimmer {
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
      background-size: 200% 100%;
    }
    .shimmer:hover {
      animation: shine 1.5s infinite;
    }
    @keyframes shine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="p-4 sm:p-8">

  <!-- 顶部标题 -->
  <header class="max-w-6xl mx-auto text-center mb-10 mt-4">
    <div class="inline-block px-4 py-1 rounded-full bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 text-xs font-semibold tracking-widest uppercase mb-3">
      Official Verification
    </div>
    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-yellow-100 via-yellow-300 to-amber-500">
      刮刮乐开奖结果查询
    </h1>
    <p class="mt-3 text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
      请对照您手中的刮刮乐编号，点击下方对应的卡片查看开奖动效与中奖详情
    </p>
  </header>

  <!-- 主视图：6张卡片网格 -->
  <main id="card-grid-view" class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8" id="cards-container">
      <!-- 卡片由下方 JS 动态渲染 -->
    </div>
  </main>

  <!-- 详情视图：开奖动效 + 奖品凭证 -->
  <section id="card-detail-view" class="hidden max-w-4xl mx-auto pb-16">
    <button id="btn-back" class="mb-6 flex items-center space-x-2 text-slate-400 hover:text-white transition px-4 py-2 rounded-lg bg-slate-900/60 border border-slate-800">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      <span>返回选择其他卡片</span>
    </button>

    <div class="bg-slate-900/80 rounded-2xl border border-yellow-500/30 p-6 sm:p-10 shadow-2xl backdrop-blur-md">
      
      <!-- 头部信息 -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-800 pb-6 mb-8">
        <div>
          <span id="detail-tag" class="text-xs px-2.5 py-1 rounded bg-yellow-400/10 text-yellow-400 border border-yellow-400/30 font-semibold tracking-wider uppercase">卡片类型</span>
          <h2 id="detail-title" class="text-2xl sm:text-3xl font-bold mt-2 text-white">01号卡片开奖结果</h2>
          <p id="detail-desc" class="text-slate-400 text-sm mt-1">奖品概要说明</p>
        </div>
        <div class="mt-4 sm:mt-0 text-right">
          <span class="text-xs text-slate-500 block">状态验证</span>
          <span class="inline-flex items-center text-xs text-emerald-400 mt-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
            已核验官方奖池
          </span>
        </div>
      </div>

      <!-- 视频播放区域 (必须手动点击播放) -->
      <div class="mb-10">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-slate-300 flex items-center">
            <svg class="w-4 h-4 mr-2 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm6.5 4.5l4 2.5-4 2.5V8.5z"/>
            </svg>
            中奖揭晓动效（点击播放）
          </h3>
          <span class="text-xs text-slate-500">时长约 30 秒</span>
        </div>

        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 shadow-inner group">
          <video 
            id="prize-video" 
            class="w-full h-full object-contain"
            playsinline
            controls
            preload="metadata"
          >
            <source id="video-source" src="" type="video/mp4">
            您的浏览器不支持视频播放，请升级浏览器。
          </video>
          
          <!-- 手动播放引导覆盖层 -->
          <div id="video-cover" class="absolute inset-0 bg-slate-950/80 flex flex-col items-center justify-center cursor-pointer transition-opacity">
            <div class="w-16 h-16 rounded-full bg-yellow-500/20 border-2 border-yellow-400 flex items-center justify-center text-yellow-400 shadow-lg transform transition group-hover:scale-110">
              <svg class="w-8 h-8 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M6.3 3.84a1 1 0 00-1.3 1.32l8 5.5a1 1 0 000 1.68l-8 5.5a1 1 0 001.3 1.32l10-6.84a1 1 0 000-1.68l-10-6.84z"/>
              </svg>
            </div>
            <span class="mt-4 text-sm font-medium text-slate-200">点击播放 30秒 中奖动画</span>
            <span class="text-xs text-slate-400 mt-1">需手动触发，无自动音画打扰</span>
          </div>
        </div>
      </div>

      <!-- 奖券详情凭证 -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-slate-300 flex items-center">
            <svg class="w-4 h-4 mr-2 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
              <path d="M4 3a2 2 0 00-2 2v2a1 1 0 001 1 1 1 0 010 2 1 1 0 00-1 1v2a2 2 0 002 2h12a2 2 0 002-2v-2a1 1 0 00-1-1 1 1 0 010-2 1 1 0 001-1V5a2 2 0 00-2-2H4z"/>
            </svg>
            官方兑奖凭证（点击图片查看大图）
          </h3>
          <span class="text-xs text-slate-500">请核对券面信息后前往兑奖</span>
        </div>

        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-4 sm:p-6 flex flex-col items-center">
          <div class="w-full max-w-lg cursor-zoom-in group relative overflow-hidden rounded-lg border border-slate-700/60 shadow-lg" id="voucher-image-wrapper">
            <img 
              id="voucher-image" 
              src="" 
              alt="兑奖凭证" 
              class="w-full h-auto object-cover transition-transform duration-300 group-hover:scale-105"
            >
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-white text-xs">
              点击放大查看高清奖券
            </div>
          </div>
          
          <div class="mt-4 text-center">
            <p id="voucher-caption" class="text-xs text-slate-400">兑奖时请向工作人员出示此凭证或保存图片</p>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- 图片全屏 Lightbox 弹窗 -->
  <div id="image-lightbox" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col items-center justify-center p-4">
    <button id="lightbox-close" class="absolute top-6 right-6 text-slate-400 hover:text-white p-2">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    <img id="lightbox-img" src="" alt="凭证大图" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
    <p class="text-xs text-slate-400 mt-4">点击空白处或右上角关闭</p>
  </div>

  <footer class="mt-16 text-center text-xs text-slate-600 pb-8">
    © 2026 活动组委会版权所有 · 结果均以官方存根为准
  </footer>

  <script>
    /* ========================================================
       卡片配置列表：直接对应你的 GitHub 仓库相对路径
       你可以根据实际情况修改奖项名称与简介
       ======================================================== */
    const CARDS = [
      {
        id: 1,
        code: "CARD-01",
        title: "01号刮刮卡",
        rewardName: "一号 · 休息卡",
        badge: "自主拍板奖",
        desc: "已核验对应 01 号序列，点击查看专属揭奖视频与官方礼品兑付凭证",
        videoUrl: "./assets/videos/card_1.mp4",
        voucherUrl: "./assets/images/voucher_1.jpg"
      },
      {
        id: 2,
        code: "CARD-02",
        title: "02号刮刮卡",
        rewardName: "二号 · 能量卡",
        badge: "石橄榄鸡煲奖",
        desc: "已核验对应 02 号序列，点击查看专属揭奖视频与官方礼品兑付凭证",
        videoUrl: "./assets/videos/card_2.mp4",
        voucherUrl: "./assets/images/voucher_2.jpg"
      },
      {
        id: 3,
        code: "CARD-03",
        title: "03号刮刮卡",
        rewardName: "三号 · 柳州旅游卡",
        badge: "螺蛳奖",
        desc: "已核验对应 03 号序列，点击查看专属揭奖视频与官方礼品兑付凭证",
        videoUrl: "./assets/videos/card_3.mp4",
        voucherUrl: "./assets/images/voucher_3.jpg"
      },
      {
        id: 4,
        code: "CARD-04",
        title: "04号刮刮卡",
        rewardName: "四号 · 汤泉卡",
        badge: "全天浸汤奖",
        desc: "已核验对应 04 号序列，点击查看专属揭奖视频与官方礼品兑付凭证",
        videoUrl: "./assets/videos/card_4.mp4",
        voucherUrl: "./assets/images/voucher_4.jpg"
      },
      {
        id: 5,
        code: "CARD-05",
        title: "05号刮刮卡",
        rewardName: "五号 · 惠州度假卡",
        badge: "尊享度假奖",
        desc: "已核验对应 05 号序列，点击查看专属揭奖视频与官方礼品兑付凭证",
        videoUrl: "./assets/videos/card_5.mp4",
        voucherUrl: "./assets/images/voucher_5.jpg"
      },
      {
        id: 6,
        code: "CARD-06",
        title: "06号刮刮卡",
        rewardName: "六号 · 耳机卡",
        badge: "Chiikawa唱歌奖",
        desc: "已核验对应 06 号序列，点击查看专属揭奖视频与官方礼品兑付凭证",
        videoUrl: "./assets/videos/card_6.mp4",
        voucherUrl: "./assets/images/voucher_6.jpg"
      }
    ];

    // DOM 元素引用
    const gridView = document.getElementById('card-grid-view');
    const detailView = document.getElementById('card-detail-view');
    const cardsContainer = document.getElementById('cards-container');
    const btnBack = document.getElementById('btn-back');

    const detailTag = document.getElementById('detail-tag');
    const detailTitle = document.getElementById('detail-title');
    const detailDesc = document.getElementById('detail-desc');
    const prizeVideo = document.getElementById('prize-video');
    const videoSource = document.getElementById('video-source');
    const videoCover = document.getElementById('video-cover');
    const voucherImage = document.getElementById('voucher-image');
    const voucherImageWrapper = document.getElementById('voucher-image-wrapper');
    const imageLightbox = document.getElementById('image-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');

    // 渲染首页 6 张卡片
    function renderGrid() {
      cardsContainer.innerHTML = '';
      CARDS.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'gold-border-glow shimmer bg-slate-900/60 rounded-xl p-6 cursor-pointer flex flex-col justify-between h-64 relative overflow-hidden group';
        cardEl.onclick = () => openCardDetail(card.id);

        cardEl.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono text-yellow-500/80 tracking-wider font-semibold">${card.code}</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-yellow-400/10 text-yellow-300 border border-yellow-400/30">${card.badge}</span>
          </div>
          
          <div class="my-auto">
            <div class="w-12 h-12 rounded-lg bg-yellow-500/10 border border-yellow-500/20 flex items-center justify-center text-yellow-400 mb-3 group-hover:scale-110 transition-transform">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path>
              </svg>
            </div>
            <h3 class="text-xl font-bold text-white group-hover:text-yellow-300 transition-colors">${card.title}</h3>
            <p class="text-xs text-slate-400 mt-1 line-clamp-1">${card.rewardName}</p>
          </div>

          <div class="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-3">
            <span>点击查看开奖动效</span>
            <span class="text-yellow-400 font-bold group-hover:translate-x-1 transition-transform">揭秘 →</span>
          </div>
        `;
        cardsContainer.appendChild(cardEl);
      });
    }

    // 打开卡片详情
    function openCardDetail(cardId) {
      const card = CARDS.find(c => c.id === cardId);
      if (!card) return;

      detailTag.innerText = card.badge;
      detailTitle.innerText = `${card.title} · ${card.rewardName}`;
      detailDesc.innerText = card.desc;

      // 重置并装载视频
      prizeVideo.pause();
      prizeVideo.currentTime = 0;
      videoSource.src = card.videoUrl;
      prizeVideo.load();
      videoCover.style.display = 'flex'; // 显示点击播放蒙层

      // 装载图片
      voucherImage.src = card.voucherUrl;

      // 切换视图
      gridView.classList.add('hidden');
      detailView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 返回列表
    btnBack.onclick = () => {
      prizeVideo.pause();
      detailView.classList.add('hidden');
      gridView.classList.remove('hidden');
    };

    // 点击覆盖层播放视频
    videoCover.onclick = () => {
      videoCover.style.display = 'none';
      prizeVideo.play().catch(e => {
        console.warn("Autoplay block or missing resource:", e);
      });
    };

    // 视频结束或手动暂停处理
    prizeVideo.onended = () => {
      videoCover.style.display = 'flex';
    };

    // 图片 Lightbox 大图逻辑
    voucherImageWrapper.onclick = () => {
      lightboxImg.src = voucherImage.src;
      imageLightbox.classList.remove('hidden');
    };

    imageLightbox.onclick = (e) => {
      if (e.target !== lightboxImg) {
        imageLightbox.classList.add('hidden');
      }
    };
    lightboxClose.onclick = () => {
      imageLightbox.classList.add('hidden');
    };

    // 初始化
    renderGrid();
  </script>
</body>
</html>
